<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Scratch 3.0 GUI</title>
  <script defer src="gui.js"></script>
</head>

<body>
  <script>
    window.addEventListener("load", async () => {
      const projectUrl = new URLSearchParams(window.location.search).get("project_url");

      if (!projectUrl) return;

      try {
        console.log("Loading project:", projectUrl);

        const response = await fetch(projectUrl);
        const arrayBuffer = await response.arrayBuffer();



        // Wait until VM is ready
        const waitForVM = setInterval(() => {
          if (window.vm) {
            clearInterval(waitForVM);
            window.vm.loadProject(arrayBuffer);
            console.log("Project loaded successfully");
          }
        }, 500);

      } catch (err) {
        console.error("Error loading project:", err);
      }
    });

  </script>
</body>

</html>
